[package]
name = "horus_atylus_pdv"
version = "1.0.0"
description = "Hórus Atylus PDV - Desktop Application"
authors = ["Luiz Portella"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

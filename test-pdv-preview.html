<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATYLUS PDV - Aplicativo Desktop (Frente de Caixa)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            horus: {
              bg: '#0b1118',
              card: '#111c26',
              surface: '#162330',

  </script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute; left: 0; top: 0; width: 80mm;
        margin: 0; padding: 0; background: white !important; color: black !important;

</head>
<body class="bg-[#070c12] text-slate-100 select-none overflow-hidden font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SINTETIZADOR WEB AUDIO API ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      getCtx() {
        if (!this.ctx && window.AudioContext) this.ctx = new AudioContext();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      playScan() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1750, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      }
      playError() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      }
      playChime() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = ctx.currentTime + idx * 0.06;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.3);
        });
      }
    }
    const sound = new SoundManager();

    // --- PRODUTOS DEMO (UNIDADE E BALANÇA) ---
    const PRODUTOS_INICIAIS = [
      { id: '1', codigoBarras: '7894900010015', nome: 'Refrigerante Coca-Cola 2L', preco: 9.50, custo: 6.00, estoque: 50, unidade: 'UN' },
      { id: '2', codigoBarras: '7891000100103', nome: 'Leite Integral Ninho 1L', preco: 5.80, custo: 3.90, estoque: 30, unidade: 'UN' },
      { id: '3', codigoBarras: '7891910000197', nome: 'Açúcar Refinado União 1kg', preco: 4.20, custo: 2.70, estoque: 40, unidade: 'UN' },
      { id: '4', codigoBarras: '7896004000153', nome: 'Café Torrado e Moído Pilão 500g', preco: 18.90, custo: 12.50, estoque: 25, unidade: 'UN' },
      { id: '5', codigoBarras: '7891024131238', nome: 'Biscoito Recheado Passatempo 130g', preco: 3.20, custo: 1.80, estoque: 60, unidade: 'UN' },
      { id: '10', codigoBarras: '10', codigoItemBalanca: '10', nome: 'Queijo Muçarela Fatiado (Balança)', preco: 49.90, custo: 32.00, estoque: 15.5, unidade: 'KG' },
      { id: '20', codigoBarras: '20', codigoItemBalanca: '20', nome: 'Pão Francês Tradicional (Balança)', preco: 14.50, custo: 8.00, estoque: 20.0, unidade: 'KG' },
    ];

    function App() {
      // Navegação por Módulos Estilo Hórus PDV
      const [moduloAtivo, setModuloAtivo] = useState('pos'); // pos | products | sales | cashier | importer | settings
      const [sidebarColapsada, setSidebarColapsada] = useState(false);

      // Estado do Catálogo
      const [produtos, setProdutos] = useState(PRODUTOS_INICIAIS);

      // Estado de Vendas Realizadas
      const [historicoVendas, setHistoricoVendas] = useState([
        {
          id: 'VND-001240',
          dataVenda: new Date(Date.now() - 25 * 60000).toISOString(),
          operador: 'Luiz Portella',
          clienteNome: 'João Silva',
          clienteDoc: '123.456.789-00',
          subtotal: 54.80,
          desconto: 5.00,
          total: 49.80,
          status: 'Concluida',
          itens: [
            { produtoId: '1', nome: 'Refrigerante Coca-Cola 2L', preco: 9.50, qtd: 2, unidade: 'UN', subtotal: 19.00 },
            { produtoId: '4', nome: 'Café Torrado Pilão 500g', preco: 18.90, qtd: 1, unidade: 'UN', subtotal: 18.90 },
            { produtoId: '10', nome: 'Queijo Muçarela Fatiado', preco: 49.90, qtd: 0.238, unidade: 'KG', subtotal: 11.90 }
          ],
          pagamentos: [
            { forma: 'Dinheiro', valor: 20.00, troco: 0 },
            { forma: 'Pix', valor: 29.80, troco: 0 }
          ]
        }
      ]);

      // Estado do Caixa
      const [caixaAberto, setCaixaAberto] = useState(true);
      const [saldoInicial, setSaldoInicial] = useState(100.00);
      const [movimentacoes, setMovimentacoes] = useState([
        { id: 1, tipo: 'Suprimento', valor: 100.00, motivo: 'Fundo inicial de troco', data: new Date().toLocaleTimeString() }
      ]);

      // Múltiplas Abas de Atendimento (PDVOpen)
      const [abas, setAbas] = useState([
        {
          id: 'aba-1',
          titulo: 'Venda 1',
          clienteNome: '',
          clienteDoc: '',
          desconto: 0,
          itens: [
            { id: 'it-1', produtoId: '1', codigoBarras: '7894900010015', nome: 'Refrigerante Coca-Cola 2L', preco: 9.50, qtd: 2, unidade: 'UN', subtotal: 19.00 },
            { id: 'it-2', produtoId: '10', codigoBarras: '10', nome: 'Queijo Muçarela Fatiado', preco: 49.90, qtd: 0.350, unidade: 'KG', subtotal: 17.47 }
          ],
          selectedId: 'it-1'
        }
      ]);
      const [abaAtivaId, setAbaAtivaId] = useState('aba-1');

      const [codigoInput, setCodigoInput] = useState('');
      const [erroMsg, setErroMsg] = useState(null);
      const [isMuted, setIsMuted] = useState(false);

      // Modais
      const [modalPagamento, setModalPagamento] = useState(false);
      const [modalBusca, setModalBusca] = useState(false);
      const [modalCaixa, setModalCaixa] = useState(false);
      const [vendaCupomParaImprimir, setVendaCupomParaImprimir] = useState(null);

      const barcodeInputRef = useRef(null);

      const abaAtiva = abas.find(a => a.id === abaAtivaId) || abas[0];
      const itens = abaAtiva.itens;
      const selectedId = abaAtiva.selectedId;
      const desconto = abaAtiva.desconto;

      // Foco automático
      useEffect(() => {
        if (moduloAtivo === 'pos' && !modalPagamento && !modalBusca && !modalCaixa && !vendaCupomParaImprimir) {
          barcodeInputRef.current?.focus();
        }
      }, [moduloAtivo, modalPagamento, modalBusca, modalCaixa, vendaCupomParaImprimir, abaAtivaId]);

      // Atalhos Globais de Teclado (F1-F4, Del, +, -, Esc, Ctrl+T, Ctrl+W, Ctrl+B, Ctrl+1..5)
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.ctrlKey) {
            if (e.key === 'b' || e.key === 'B') {
              e.preventDefault();
              setSidebarColapsada(prev => !prev);
              return;
            }
            if (moduloAtivo === 'pos') {
              if (e.key === 't' || e.key === 'T') {
                e.preventDefault();
                criarNovaAba();
                return;
              }
              if (e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                fecharAba(abaAtivaId);
                return;
              }
              const num = parseInt(e.key, 10);
              if (!isNaN(num) && num >= 1 && num <= abas.length) {
                e.preventDefault();
                setAbaAtivaId(abas[num - 1].id);
                sound.playScan();
                return;
              }
            }
          }

          if (modalPagamento || modalBusca || modalCaixa || vendaCupomParaImprimir) {
            if (e.key === 'Escape') {
              setModalPagamento(false);
              setModalBusca(false);
              setModalCaixa(false);
              setVendaCupomParaImprimir(null);
            }
            return;
          }

          if (e.key === 'F1') {
            e.preventDefault();
            setModuloAtivo('pos');
            if (itens.length > 0 && caixaAberto) setModalPagamento(true);
            else { sound.playError(); setErroMsg('Caixa fechado ou carrinho vazio.'); }
          } else if (e.key === 'F2') {
            e.preventDefault();
            setModuloAtivo('pos');
            setModalBusca(true);
          } else if (e.key === 'F3') {
            e.preventDefault();
            setModalCaixa(true);
          } else if (e.key === 'F4') {
            e.preventDefault();
            setModuloAtivo('importer');
          } else if (e.key === 'Delete' && moduloAtivo === 'pos') {
            e.preventDefault();
            removerItem(selectedId);
          } else if (e.key === 'Escape' && moduloAtivo === 'pos') {
            e.preventDefault();
            if (itens.length > 0 && confirm('Deseja limpar os itens desta venda?')) {
              atualizarAbaAtual({ itens: [], selectedId: null, desconto: 0 });
            }
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [moduloAtivo, modalPagamento, modalBusca, modalCaixa, vendaCupomParaImprimir, itens, caixaAberto, selectedId, abaAtivaId, abas]);

      const criarNovaAba = (nome) => {
        const prox = abas.length + 1;
        const nova = {
          id: 'aba-' + Date.now(),
          titulo: nome || `Venda ${prox}`,
          clienteNome: '',
          clienteDoc: '',
          desconto: 0,
          itens: [],
          selectedId: null
        };
        setAbas(prev => [...prev, nova]);
        setAbaAtivaId(nova.id);
        sound.playScan();
      };

      const fecharAba = (id) => {
        if (abas.length <= 1) {
          atualizarAbaAtual({ itens: [], selectedId: null, desconto: 0 });
          return;
        }
        const filtradas = abas.filter(a => a.id !== id);
        setAbas(filtradas);
        setAbaAtivaId(filtradas[0].id);
      };

      const atualizarAbaAtual = (dados) => {
        setAbas(prev => prev.map(a => a.id === abaAtivaId ? { ...a, ...dados } : a));
      };

      const adicionarAoCarrinho = (produto, quantidade = 1, unidade) => {
        sound.playScan();
        setErroMsg(null);
        const un = unidade || produto.unidade || 'UN';

        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;

          const ex = aba.itens.find(i => i.produtoId === produto.id && i.unidade === un);
          let nItens;
          let sId;

          if (ex) {
            const nQtd = parseFloat((ex.qtd + quantidade).toFixed(3));
            nItens = aba.itens.map(i => i.id === ex.id ? { ...i, qtd: nQtd, subtotal: parseFloat((nQtd * i.preco).toFixed(2)) } : i);
            sId = ex.id;
          } else {
            const novo = {
              id: 'it-' + Date.now(),
              produtoId: produto.id,
              codigoBarras: produto.codigoBarras,
              nome: produto.nome,
              preco: produto.preco,
              qtd: quantidade,
              unidade: un,
              subtotal: parseFloat((quantidade * produto.preco).toFixed(2))
            };
            nItens = [...aba.itens, novo];
            sId = novo.id;
          }
          return { ...aba, itens: nItens, selectedId: sId };
        }));
      };

      const alterarQtd = (id, delta) => {
        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;
          const nItens = aba.itens.map(i => {
            if (i.id === id) {
              const passo = i.unidade === 'KG' ? 0.1 : 1;
              const nQtd = Math.max(passo, parseFloat((i.qtd + (delta > 0 ? passo : -passo)).toFixed(3)));
              return { ...i, qtd: nQtd, subtotal: parseFloat((nQtd * i.preco).toFixed(2)) };
            }
            return i;
          });
          return { ...aba, itens: nItens };
        }));
      };

      const removerItem = (id) => {
        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;
          const filtrados = aba.itens.filter(i => i.id !== id);
          const sId = filtrados.length > 0 ? filtrados[filtrados.length - 1].id : null;
          return { ...aba, itens: filtrados, selectedId: sId };
        }));
      };

      // Leitor de Código de Barras (com Multiplicação e Balança EAN-13 iniciando em 2)
      const handleBarcodeSubmit = (e) => {
        e.preventDefault();
        const entrada = codigoInput.trim();
        if (!entrada) return;

        if (!caixaAberto) {
          sound.playError();
          setErroMsg('Caixa fechado! Abra o caixa [F3] antes de bipar itens.');
          return;
        }

        let qtd = 1;
        let cod = entrada;
        if (entrada.includes('*')) {
          const p = entrada.split('*');
          const q = parseFloat(p[0]);
          if (!isNaN(q) && q > 0) { qtd = q; cod = p[1].trim(); }
        }

        // Decodificador de Balança EAN-13 (começa com 2)
        if (cod.startsWith('2') && (cod.length === 12 || cod.length === 13)) {
          const codProd = cod.substring(1, 6).replace(/^0+/, '');
          const centavos = parseInt(cod.substring(6, 12), 10);
          const valorReais = centavos / 100.0;

          const prodBalanca = produtos.find(p => p.codigoItemBalanca === codProd || p.id === codProd);
          if (prodBalanca) {
            const pesoKg = parseFloat((valorReais / prodBalanca.preco).toFixed(3));
            adicionarAoCarrinho(prodBalanca, pesoKg, 'KG');
            setCodigoInput('');
            return;
          }
        }

        const prod = produtos.find(p => p.codigoBarras === cod);
        if (prod) {
          adicionarAoCarrinho(prod, qtd);
          setCodigoInput('');
        } else {
          sound.playError();
          setErroMsg(`Produto com código '${cod}' não localizado.`);
        }
      };

      const totalBruto = itens.reduce((acc, i) => acc + i.subtotal, 0);
      const totalLiquido = Math.max(0, totalBruto - desconto);
      const totalItens = itens.reduce((acc, i) => acc + (i.unidade === 'KG' ? 1 : i.qtd), 0);

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-[#070c12]">
          {/* 1. BARRA DE TÍTULO DESKTOP */}
          <div className="h-8 bg-[#05080d] border-b border-[#162330] flex items-center justify-between px-3 select-none text-xs font-mono text-slate-400 z-50">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-sky-500 shadow-sm shadow-sky-500/50"></span>
              <span className="font-extrabold text-slate-200 tracking-wider">ATYLUS PDV</span>
              <span className="text-[10px] text-slate-500 bg-[#0d151f] px-1.5 py-0.2 rounded border border-slate-800">Desktop</span>
            </div>

            <div className="flex items-center gap-4 text-[11px]">
              <span className="text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded-full border border-emerald-900/60">
                ⚡ 100% Offline-First | SQLite Local
              </span>
              <span className="text-slate-400 font-bold">{new Date().toLocaleTimeString('pt-BR')}</span>
            </div>

            <div className="flex items-center gap-1">
              <button className="w-6 h-5 flex items-center justify-center hover:bg-slate-800 rounded text-slate-400">-</button>
              <button className="w-6 h-5 flex items-center justify-center hover:bg-slate-800 rounded text-slate-400">▢</button>
              <button className="w-6 h-5 flex items-center justify-center hover:bg-red-600 rounded text-slate-400 hover:text-white">✕</button>
            </div>
          </div>

          {/* 2. ÁREA PRINCIPAL COM MENU LATERAL (HÓRUS PDV) */}
          <div className="flex-1 flex overflow-hidden">
            {/* SIDEBAR COLAPSÁVEL */}
            <aside className={`bg-[#0b1118] border-r border-[#1a2938] flex flex-col justify-between transition-all duration-200 select-none z-40 ${sidebarColapsada ? 'w-16' : 'w-60'}`}>
              <div>
                <div className="p-3 border-b border-[#1a2938] flex items-center justify-between">
                  {!sidebarColapsada && (
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-lg bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold font-mono text-sm">H</div>
                      <span className="font-bold text-xs text-white tracking-wide">Menu do PDV</span>
                    </div>
                  )}
                  <button
                    onClick={() => setSidebarColapsada(!sidebarColapsada)}
                    className="p-1 rounded bg-[#111c26] hover:bg-[#182635] text-slate-400 hover:text-white mx-auto text-xs font-mono"
                    title="Recolher/Expandir (Ctrl+B)"
                  >
                    {sidebarColapsada ? '▶' : '◀'}
                  </button>
                </div>

                <nav className="p-2 space-y-1 text-xs font-medium">
                  {[
                    { id: 'pos', label: 'Frente de Caixa', icon: '🛒', atalho: 'F1-F4' },
                    { id: 'products', label: 'Produtos & Estoque', icon: '📦', atalho: 'Catálogo' },
                    { id: 'sales', label: 'Histórico de Vendas', icon: '📊', atalho: 'Turno' },
                    { id: 'cashier', label: 'Controle de Caixa', icon: '🔒', atalho: 'F3' },
                    { id: 'importer', label: 'Importador IA & XML', icon: '📥', atalho: 'F4' },
                    { id: 'settings', label: 'Configurações', icon: '⚙️', atalho: 'Ajustes' },
                  ].map(item => {
                    const ativo = moduloAtivo === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => {
                          if (item.id === 'cashier') setModalCaixa(true);
                          else setModuloAtivo(item.id);
                        }}
                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition ${
                          ativo
                            ? 'bg-sky-600 text-white font-bold shadow-md shadow-sky-600/30'
                            : 'text-slate-400 hover:bg-[#111c26] hover:text-slate-200'
                        }`}
                        title={sidebarColapsada ? item.label : undefined}
                      >
                        <span className="text-base">{item.icon}</span>
                        {!sidebarColapsada && (
                          <div className="flex-1 flex items-center justify-between truncate">
                            <span className="truncate">{item.label}</span>
                            <span className={`text-[10px] font-mono px-1 rounded ${ativo ? 'bg-sky-700 text-white' : 'bg-[#111c26] text-slate-500'}`}>{item.atalho}</span>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* Status do Operador */}
              <div className="p-3 border-t border-[#1a2938] bg-[#080d13] flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-sky-600 flex items-center justify-center text-white font-bold text-xs">LP</div>
                {!sidebarColapsada && (
                  <div className="text-[11px] font-mono truncate">
                    <span className="text-white font-bold block truncate">Luiz Portella</span>
                    <span className="text-slate-500 text-[10px]">Caixa 01 • Operador</span>
                  </div>
                )}
              </div>
            </aside>

            {/* CONTEÚDO DO MÓDULO ATIVO */}
            <main className="flex-1 flex flex-col overflow-hidden bg-[#070c12]">
              {/* MÓDULO 1: FRENTE DE CAIXA (PDV) */}
              {moduloAtivo === 'pos' && (
                <div className="flex-1 flex flex-col h-full overflow-hidden">
                  {/* BARRA DE MÚLTIPLAS ABAS (PDVOpen) */}
                  <div className="bg-[#0b1118] border-b border-[#1a2938] px-3 py-1.5 flex items-center gap-2 overflow-x-auto select-none font-mono">
                    <span className="text-[11px] font-bold text-slate-500 uppercase mr-1">Vendas:</span>
                    {abas.map((aba, index) => {
                      const isAtiva = aba.id === abaAtivaId;
                      const totalAba = aba.itens.reduce((acc, i) => acc + i.subtotal, 0);

                      return (
                        <div
                          key={aba.id}
                          onClick={() => setAbaAtivaId(aba.id)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 cursor-pointer transition border ${
                            isAtiva
                              ? 'bg-sky-600 text-white border-sky-500 shadow-md'
                              : 'bg-[#111c26] text-slate-400 border-[#1f3042] hover:bg-[#182635] text-slate-300'
                          }`}
                        >
                          <span>{index + 1}. {aba.titulo}</span>
                          {totalAba > 0 && (
                            <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold ${isAtiva ? 'bg-sky-700 text-white' : 'bg-slate-800 text-slate-300'}`}>
                              R$ {totalAba.toFixed(2)}
                            </span>
                          )}
                          {abas.length > 1 && (
                            <button
                              onClick={(e) => { e.stopPropagation(); fecharAba(aba.id); }}
                              className="hover:text-red-300 ml-0.5 text-xs font-bold"

              onAbrir={saldo => {
                setSaldoInicial(saldo);
                setCaixaAberto(true);
                setMovimentacoes([{ id: Date.now(), tipo: 'Suprimento', valor: saldo, motivo: 'Abertura de Caixa', data: new Date().toLocaleTimeString() }]);
                setModalCaixa(false);
              }}
              onMovimentacao={(tipo, val, mot) => {
                setMovimentacoes(prev => [...prev, { id: Date.now(), tipo, valor: val, motivo: mot, data: new Date().toLocaleTimeString() }]);
              }}
              onFecharCego={saldoContado => {
                setCaixaAberto(false);
                setModalCaixa(false);
                alert(`Caixa Fechado com Sucesso! Valor Informado: R$ ${saldoContado.toFixed(2)}. Backup SQLite compactado.`);
              }}
              onClose={() => setModalCaixa(false)}
            />
          )}

          {/* MODAL CUPOM TÉRMICO */}
          {vendaCupomParaImprimir && (
            <ModalCupomAvancadoComponent
              venda={vendaCupomParaImprimir}
              onClose={() => setVendaCupomParaImprimir(null)}
            />
          )}
        </div>
      );
    }

    // --- SUB-COMPONENTES MODAIS ---
    function ModalPagamentoMultiformasComponent({ total, clienteNomeInicial, clienteDocInicial, onClose, onSucesso }) {
      const [forma, setForma] = useState('Dinheiro');
      const [pagamentosLancados, setPagamentosLancados] = useState([]);
      const [clienteNome, setClienteNome] = useState(clienteNomeInicial || '');
      const [clienteDoc, setClienteDoc] = useState(clienteDocInicial || '');

      const totalPago = pagamentosLancados.reduce((acc, p) => acc + (p.valor - (p.troco || 0)), 0);
      const restante = Math.max(0, parseFloat((total - totalPago).toFixed(2)));
      const isQuitado = restante <= 0.009;

      const [valorParcela, setValorParcela] = useState(total);
      const [dinheiroEntregue, setDinheiroEntregue] = useState(total);

      useEffect(() => {
        if (restante > 0) {
          setValorParcela(restante);
          setDinheiroEntregue(restante);
        }
      }, [restante]);

      const trocoCalculado = forma === 'Dinheiro' ? Math.max(0, dinheiroEntregue - valorParcela) : 0;

      const lancar = () => {
        if (valorParcela <= 0) return;
        setPagamentosLancados(prev => [
          ...prev,
          { id: Date.now(), forma, valor: valorParcela, troco: trocoCalculado }
        ]);
        sound.playScan();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-3xl bg-[#0d1620] border border-[#1f3042] rounded-3xl overflow-hidden shadow-2xl flex flex-col font-sans max-h-[95vh]">
            <div className="p-4 bg-[#14212e] border-b border-[#1f3042] flex justify-between items-center">
              <div>
                <h3 className="font-bold text-white text-base">💰 Pagamento Multiformas (Padrão PDVOpen)</h3>
                <p className="text-xs text-slate-400 font-mono">Total a Pagar: R$ {total.toFixed(2)}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-mono text-xl">✕</button>
            </div>

            <div className="grid grid-cols-3 p-4 bg-[#080d13] border-b border-[#1f3042] text-center font-mono">
              <div>
                <span className="text-[10px] text-slate-400 uppercase">Total da Venda</span>
                <div className="text-xl font-bold text-white">R$ {total.toFixed(2)}</div>
              </div>
              <div>
                <span className="text-[10px] text-slate-400 uppercase">Já Lançado</span>
                <div className="text-xl font-bold text-sky-400">R$ {totalPago.toFixed(2)}</div>
              </div>
              <div>
                <span className="text-[10px] uppercase font-bold text-slate-400">{isQuitado ? 'Status' : 'Falta Pagar'}</span>
                <div className={`text-xl font-black ${isQuitado ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {isQuitado ? 'QUITADO' : `R$ ${restante.toFixed(2)}`}
                </div>
              </div>
            </div>

            <div className="p-6 flex-1 overflow-y-auto space-y-4 font-mono text-xs">
              <div className="p-3 bg-[#080d13] rounded-xl border border-[#1f3042] flex gap-3">
                <input
                  type="text"
                  placeholder="Nome do Cliente (opcional no cupom)"
                  value={clienteNome}
                  onChange={e => setClienteNome(e.target.value)}
                  className="flex-1 p-2 bg-[#111c26] border border-[#1f3042] rounded-lg text-white"
                />
                <input
                  type="text"
                  placeholder="CPF / CNPJ"
                  value={clienteDoc}
                  onChange={e => setClienteDoc(e.target.value)}
                  className="w-48 p-2 bg-[#111c26] border border-[#1f3042] rounded-lg text-white"
                />
              </div>

              {!isQuitado && (
                <div className="space-y-3">
                  <div className="grid grid-cols-4 gap-2">
                    {['Dinheiro', 'Pix', 'CartaoCredito', 'CartaoDebito'].map(f => (
                      <button
                        key={f}
                        onClick={() => setForma(f)}
                        className={`p-2.5 rounded-xl font-bold border transition ${forma === f ? 'bg-sky-600 text-white border-sky-500' : 'bg-[#111c26] text-slate-400 border-[#1f3042]'}`}
                      >
                        {f === 'CartaoCredito' ? '💳 Crédito' : f === 'CartaoDebito' ? '💳 Débito' : f === 'Pix' ? '⚡ Pix' : '💵 Dinheiro'}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400">Valor Desta Parcela (R$):</label>
                      <input
                        type="number"
                        step="0.01"
                        max={restante}
                        value={valorParcela}
                        onChange={e => setValorParcela(Math.min(restante, parseFloat(e.target.value) || 0))}
                        className="w-full p-2.5 bg-[#080d13] border border-[#1f3042] rounded-xl text-lg font-bold text-white mt-1"
                      />
                    </div>
                    {forma === 'Dinheiro' && (
                      <div>
                        <label className="text-slate-400">Dinheiro Entregue (Troco):</label>
                        <input
                          type="number"
                          step="0.01"
                          value={dinheiroEntregue}
                          onChange={e => setDinheiroEntregue(parseFloat(e.target.value) || 0)}
                          className="w-full p-2.5 bg-[#080d13] border border-[#1f3042] rounded-xl text-lg font-bold text-white mt-1"
                        />
                      </div>
                    )}
                  </div>

                  {forma === 'Dinheiro' && trocoCalculado > 0 && (
                    <div className="p-2.5 bg-amber-950/60 border border-amber-800 rounded-xl text-amber-300 flex justify-between font-bold">
                      <span>TROCO NESTA PARCELA:</span>
                      <span className="text-base">R$ {trocoCalculado.toFixed(2)}</span>
                    </div>
                  )}

                  <button
                    onClick={lancar}
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-500 font-bold text-white rounded-xl"
                  >
                    + Adicionar Parcela de R$ {valorParcela.toFixed(2)} no {forma}
                  </button>
                </div>
              )}

              <div>
                <h4 className="text-slate-400 font-bold uppercase mb-2">Parcelas Lançadas:</h4>
                {pagamentosLancados.length === 0 ? (
                  <p className="text-slate-600">Nenhum pagamento lançado ainda.</p>
                ) : (
                  <div className="space-y-1.5">
                    {pagamentosLancados.map((p, idx) => (
                      <div key={idx} className="p-2.5 bg-[#080d13] rounded-xl border border-[#1f3042] flex justify-between items-center">
                        <span>• {p.forma} {p.troco > 0 ? `(Troco R$ ${p.troco.toFixed(2)})` : ''}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-emerald-400 font-bold">R$ {p.valor.toFixed(2)}</span>
                          <button onClick={() => setPagamentosLancados(prev => prev.filter((_, i) => i !== idx))} className="text-red-400 font-bold ml-2">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="p-4 bg-[#080d13] border-t border-[#1f3042] flex justify-between font-mono text-xs">
              <button onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">[Esc] Cancelar</button>
              <button
                disabled={!isQuitado}
                onClick={() => onSucesso(pagamentosLancados, { nome: clienteNome, doc: clienteDoc })}
                className={`px-6 py-2.5 rounded-xl font-bold ${isQuitado ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
              >
                {isQuitado ? 'Confirmar e Fechar Venda (Enter)' : `Falta lançar R$ ${restante.toFixed(2)}`}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ModalBuscaComponent({ produtos, onClose, onSelecionar }) {
      const [termo, setTermo] = useState('');
      const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo.toLowerCase()) || p.codigoBarras.includes(termo));

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-xl bg-[#0d1620] border border-[#1f3042] rounded-2xl overflow-hidden shadow-2xl flex flex-col font-sans max-h-[80vh]">
            <div className="p-4 bg-[#14212e] border-b border-[#1f3042] flex justify-between items-center">
              <h3 className="font-bold text-white">🔍 Buscar Produtos (F2)</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>
            <div className="p-4 border-b border-[#1f3042]">
              <input
                autoFocus
                type="text"
                placeholder="Digite o nome ou código..."
                value={termo}
                onChange={e => setTermo(e.target.value)}
                className="w-full p-2.5 bg-[#080d13] border border-[#1f3042] rounded-xl text-white font-mono text-xs"
              />
            </div>
            <div className="flex-1 overflow-y-auto divide-y divide-[#1a2938] p-2 font-mono text-xs">
              {filtrados.map(p => (
                <div
                  key={p.id}
                  onClick={() => onSelecionar(p)}
                  className="p-3 hover:bg-[#111c26] rounded-xl cursor-pointer flex justify-between items-center"
                >
                  <div>
                    <span className="font-bold text-slate-200">{p.nome}</span>
                    <span className="block text-[10px] text-slate-500">{p.codigoBarras} • Estoque: {p.estoque} {p.unidade}</span>
                  </div>
                  <span className="text-emerald-400 font-bold">R$ {p.preco.toFixed(2)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ModalCaixaComponent({ caixaAberto, saldoInicial, movimentacoes, onAbrir, onMovimentacao, onFecharCego, onClose }) {
      const [aba, setAba] = useState(caixaAberto ? 'mov' : 'abrir');
      const [novoSaldo, setNovoSaldo] = useState(100);
      const [tipo, setTipo] = useState('Sangria');
      const [val, setVal] = useState(50);
      const [mot, setMot] = useState('');
      const [contado, setContado] = useState(0);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-lg bg-[#0d1620] border border-[#1f3042] rounded-2xl overflow-hidden shadow-2xl flex flex-col font-sans">
            <div className="p-4 bg-[#14212e] border-b border-[#1f3042] flex justify-between items-center">
              <h3 className="font-bold text-white">🔒 Gestão de Caixa (F3)</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="p-6 space-y-4 font-mono text-xs">
              {caixaAberto ? (
                <>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => setAba('mov')} className={`p-2 rounded-lg font-bold ${aba === 'mov' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Sangria / Suprimento</button>
                    <button onClick={() => setAba('fechar')} className={`p-2 rounded-lg font-bold ${aba === 'fechar' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Fechamento Cego</button>
                  </div>

                  {aba === 'mov' && (
                    <div className="space-y-3 pt-2">
                      <div className="flex gap-2">
                        <button onClick={() => setTipo('Sangria')} className={`flex-1 p-2 rounded-lg font-bold ${tipo === 'Sangria' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Retirada (Sangria)</button>
                        <button onClick={() => setTipo('Suprimento')} className={`flex-1 p-2 rounded-lg font-bold ${tipo === 'Suprimento' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Entrada (Suprimento)</button>
                      </div>
                      <input type="number" value={val} onChange={e => setVal(parseFloat(e.target.value) || 0)} className="w-full p-2.5 bg-[#080d13] border border-[#1f3042] rounded-xl text-white" placeholder="Valor (R$)" />
                      <input type="text" value={mot} onChange={e => setMot(e.target.value)} className="w-full p-2.5 bg-[#080d13] border border-[#1f3042] rounded-xl text-white" placeholder="Motivo da movimentação" />
                      <button onClick={() => { onMovimentacao(tipo, val, mot); setMot(''); alert('Movimentação registrada!'); }} className="w-full p-2.5 bg-sky-600 font-bold text-white rounded-xl">Registrar Movimentação</button>
                    </div>
                  )}

                  {aba === 'fechar' && (
                    <div className="space-y-3 pt-2">
                      <p className="text-amber-300">Digite o valor contado na gaveta para auditoria cega:</p>
                      <input type="number" value={contado} onChange={e => setContado(parseFloat(e.target.value) || 0)} className="w-full p-3 bg-[#080d13] border border-[#1f3042] rounded-xl text-xl font-bold text-white" />
                      <button onClick={() => onFecharCego(contado)} className="w-full p-3 bg-amber-500 font-bold text-slate-950 rounded-xl">Conferir e Fechar Caixa</button>
                    </div>
                  )}
                </>
              ) : (
                <div className="space-y-3">
                  <p className="text-slate-400">O caixa está fechado. Informe o fundo de troco inicial:</p>
                  <input type="number" value={novoSaldo} onChange={e => setNovoSaldo(parseFloat(e.target.value) || 0)} className="w-full p-3 bg-[#080d13] border border-[#1f3042] rounded-xl text-xl font-bold text-white" />
                  <button onClick={() => onAbrir(novoSaldo)} className="w-full p-3 bg-emerald-500 font-bold text-slate-950 rounded-xl">Confirmar Abertura de Caixa</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ModalCupomAvancadoComponent({ venda, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-[#0d1620] border border-[#1f3042] rounded-2xl overflow-hidden shadow-2xl flex flex-col font-sans">
            <div className="p-3 bg-[#14212e] flex justify-between items-center text-xs font-bold text-white">
              <span>🧾 Comprovante Térmico de Venda</span>
              <button onClick={onClose}>✕</button>
            </div>

            <div className="p-4 bg-slate-950 flex justify-center">
              <div id="printable-receipt" className="w-[80mm] bg-amber-50 text-slate-900 p-4 font-mono text-xs select-text border border-slate-300">
                <div className="text-center border-b border-dashed border-slate-400 pb-2 mb-2">
                  <div className="font-bold text-sm">ATYLUS COMERCIAL PDV</div>
                  <div className="text-[10px] text-slate-600">Rua do Comércio, 1000 - Centro</div>
                  <div className="text-[10px] font-bold mt-1">*** CUPOM NÃO FISCAL ***</div>
                </div>

                <div className="text-[10px] border-b border-dashed border-slate-400 pb-2 mb-2 space-y-0.5">
                  <div>Venda: #{venda.id}</div>
                  <div>Data: {new Date(venda.dataVenda).toLocaleString('pt-BR')}</div>
                  <div>Operador: {venda.operador}</div>
                  {venda.clienteNome && (
                    <div className="pt-1 text-slate-700 font-semibold border-t border-slate-200">
                      <div>Cliente: {venda.clienteNome}</div>
                      {venda.clienteDoc && <div>Doc: {venda.clienteDoc}</div>}
                    </div>
                  )}
                </div>

                <div className="border-b border-dashed border-slate-400 pb-2 mb-2 text-[10px]">
                  {venda.itens.map((it, idx) => (
                    <div key={idx} className="flex justify-between my-0.5">
                      <span>{it.unidade === 'KG' ? `${it.qtd.toFixed(3)}kg` : `${it.qtd}x`} {it.nome.slice(0, 16)}</span>
                      <span>R$ {it.subtotal.toFixed(2)}</span>
                    </div>
                  ))}
                </div>

                <div className="border-b border-dashed border-slate-400 pb-2 mb-2 text-xs">
                  <div className="flex justify-between font-bold text-sm">
                    <span>TOTAL:</span>
                    <span>R$ {venda.total.toFixed(2)}</span>
                  </div>

                  <div className="text-[10px] mt-1 space-y-0.5 border-t border-slate-200 pt-1">
                    <div className="font-bold">Pagamento(s):</div>
                    {venda.pagamentos.map((p, idx) => (
                      <div key={idx} className="flex justify-between">
                        <span>• {p.forma}:</span>
                        <span>R$ {p.valor.toFixed(2)}</span>
                      </div>
                    ))}
                    {venda.pagamentos.some(p => p.troco > 0) && (
                      <div className="flex justify-between font-bold text-slate-800 pt-0.5 border-t border-slate-200">
                        <span>TROCO:</span>
                        <span>R$ {venda.pagamentos.find(p => p.troco > 0)?.troco.toFixed(2)}</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="text-center text-[10px] text-slate-600 pt-1">
                  <div>Obrigado pela preferência!</div>
                  <div className="font-mono text-[9px] mt-1">|||||||||||||||||||||||||||||||||</div>
                </div>
              </div>
            </div>

            <div className="p-3 bg-[#0d1620] border-t border-[#1f3042] flex justify-between text-xs font-mono">
              <button onClick={onClose} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded">[Esc] Fechar</button>
              <button onClick={() => window.print()} className="px-4 py-1.5 bg-emerald-500 font-bold text-slate-950 rounded">Imprimir Cupom</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

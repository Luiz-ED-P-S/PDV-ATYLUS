<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDV Atylus - Teste Interativo de Frente de Caixa (Inspirado no PDVOpen & Horus)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            retail: {
              dark: '#0a0f1d',
              card: '#111827',
              border: '#1f2937',
              primary: '#10b981',
              secondary: '#38bdf8',
              accent: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute; left: 0; top: 0; width: 80mm;
        margin: 0; padding: 0; background: white !important; color: black !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 select-none overflow-hidden font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SINTETIZADOR WEB AUDIO API ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      getCtx() {
        if (!this.ctx && window.AudioContext) this.ctx = new AudioContext();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      playScan() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1750, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      }
      playError() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      }
      playChime() {
        if (this.muted) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = ctx.currentTime + idx * 0.06;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.3);
        });
      }
    }
    const sound = new SoundManager();

    // --- CATÁLOGO DE PRODUTOS DEMO (UNIDADE E QUILO/BALANÇA) ---
    const PRODUTOS_DEMO = [
      { id: '1', codigoBarras: '7894900010015', nome: 'Refrigerante Coca-Cola 2L', preco: 9.50, estoque: 50, unidade: 'UN' },
      { id: '2', codigoBarras: '7891000100103', nome: 'Leite Integral Ninho 1L', preco: 5.80, estoque: 30, unidade: 'UN' },
      { id: '3', codigoBarras: '7891910000197', nome: 'Açúcar Refinado União 1kg', preco: 4.20, estoque: 40, unidade: 'UN' },
      { id: '4', codigoBarras: '7896004000153', nome: 'Café Torrado e Moído Pilão 500g', preco: 18.90, estoque: 25, unidade: 'UN' },
      { id: '5', codigoBarras: '7891024131238', nome: 'Biscoito Recheado Passatempo 130g', preco: 3.20, estoque: 60, unidade: 'UN' },
      { id: '10', codigoBarras: '10', codigoItemBalanca: '10', nome: 'Queijo Muçarela Fatiado (Balança)', preco: 49.90, estoque: 15.5, unidade: 'KG' },
      { id: '20', codigoBarras: '20', codigoItemBalanca: '20', nome: 'Pão Francês Tradicional (Balança)', preco: 14.50, estoque: 20.0, unidade: 'KG' },
    ];

    function App() {
      // Estado de Caixa
      const [caixaAberto, setCaixaAberto] = useState(true);
      const [saldoInicial, setSaldoInicial] = useState(100.00);
      const [movimentacoes, setMovimentacoes] = useState([
        { id: 1, tipo: 'Suprimento', valor: 100.00, motivo: 'Fundo inicial de troco', data: new Date().toLocaleTimeString() }
      ]);

      // Múltiplas Abas de Atendimento (PDVOpen)
      const [abas, setAbas] = useState([
        {
          id: 'aba-1',
          titulo: 'Venda 1',
          clienteNome: '',
          clienteDoc: '',
          desconto: 0,
          itens: [
            { id: 'it-1', produtoId: '1', codigoBarras: '7894900010015', nome: 'Refrigerante Coca-Cola 2L', preco: 9.50, qtd: 2, unidade: 'UN', subtotal: 19.00 },
            { id: 'it-2', produtoId: '10', codigoBarras: '10', nome: 'Queijo Muçarela Fatiado', preco: 49.90, qtd: 0.350, unidade: 'KG', subtotal: 17.47 }
          ],
          selectedId: 'it-1'
        }
      ]);
      const [abaAtivaId, setAbaAtivaId] = useState('aba-1');

      const [codigoInput, setCodigoInput] = useState('');
      const [erroMsg, setErroMsg] = useState(null);
      const [isMuted, setIsMuted] = useState(false);

      // Modais
      const [modalPagamento, setModalPagamento] = useState(false);
      const [modalBusca, setModalBusca] = useState(false);
      const [modalCaixa, setModalCaixa] = useState(false);
      const [modalImportador, setModalImportador] = useState(false);
      const [vendaConcluida, setVendaConcluida] = useState(null);

      const barcodeInputRef = useRef(null);

      const abaAtiva = abas.find(a => a.id === abaAtivaId) || abas[0];
      const itens = abaAtiva.itens;
      const selectedId = abaAtiva.selectedId;
      const desconto = abaAtiva.desconto;

      // Foco automático
      useEffect(() => {
        if (!modalPagamento && !modalBusca && !modalCaixa && !modalImportador && !vendaConcluida) {
          barcodeInputRef.current?.focus();
        }
      }, [modalPagamento, modalBusca, modalCaixa, modalImportador, vendaConcluida, abaAtivaId]);

      // Atalhos Globais (F1-F4, Del, +, -, Esc, Ctrl+T, Ctrl+W, Ctrl+1..5)
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.ctrlKey) {
            if (e.key === 't' || e.key === 'T') {
              e.preventDefault();
              criarNovaAba();
              return;
            }
            if (e.key === 'w' || e.key === 'W') {
              e.preventDefault();
              fecharAba(abaAtivaId);
              return;
            }
            const num = parseInt(e.key, 10);
            if (!isNaN(num) && num >= 1 && num <= abas.length) {
              e.preventDefault();
              setAbaAtivaId(abas[num - 1].id);
              sound.playScan();
              return;
            }
          }

          if (modalPagamento || modalBusca || modalCaixa || modalImportador || vendaConcluida) {
            if (e.key === 'Escape') {
              setModalPagamento(false);
              setModalBusca(false);
              setModalCaixa(false);
              setModalImportador(false);
              setVendaConcluida(null);
            }
            return;
          }

          if (e.key === 'F1') {
            e.preventDefault();
            if (itens.length > 0 && caixaAberto) setModalPagamento(true);
            else { sound.playError(); setErroMsg('Caixa fechado ou carrinho vazio.'); }
          } else if (e.key === 'F2') {
            e.preventDefault();
            setModalBusca(true);
          } else if (e.key === 'F3') {
            e.preventDefault();
            setModalCaixa(true);
          } else if (e.key === 'F4') {
            e.preventDefault();
            setModalImportador(true);
          } else if (e.key === 'Delete') {
            e.preventDefault();
            removerItem(selectedId);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            if (itens.length > 0 && confirm('Deseja limpar os itens desta venda?')) {
              atualizarAbaAtual({ itens: [], selectedId: null, desconto: 0 });
            }
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [modalPagamento, modalBusca, modalCaixa, modalImportador, vendaConcluida, itens, caixaAberto, selectedId, abaAtivaId, abas]);

      const criarNovaAba = (nome) => {
        const prox = abas.length + 1;
        const nova = {
          id: 'aba-' + Date.now(),
          titulo: nome || `Venda ${prox}`,
          clienteNome: '',
          clienteDoc: '',
          desconto: 0,
          itens: [],
          selectedId: null
        };
        setAbas(prev => [...prev, nova]);
        setAbaAtivaId(nova.id);
        sound.playScan();
      };

      const fecharAba = (id) => {
        if (abas.length <= 1) {
          atualizarAbaAtual({ itens: [], selectedId: null, desconto: 0 });
          return;
        }
        const filtradas = abas.filter(a => a.id !== id);
        setAbas(filtradas);
        setAbaAtivaId(filtradas[0].id);
      };

      const atualizarAbaAtual = (dados) => {
        setAbas(prev => prev.map(a => a.id === abaAtivaId ? { ...a, ...dados } : a));
      };

      const adicionarAoCarrinho = (produto, quantidade = 1, unidade) => {
        sound.playScan();
        setErroMsg(null);
        const un = unidade || produto.unidade || 'UN';

        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;

          const ex = aba.itens.find(i => i.produtoId === produto.id && i.unidade === un);
          let nItens;
          let sId;

          if (ex) {
            const nQtd = parseFloat((ex.qtd + quantidade).toFixed(3));
            nItens = aba.itens.map(i => i.id === ex.id ? { ...i, qtd: nQtd, subtotal: parseFloat((nQtd * i.preco).toFixed(2)) } : i);
            sId = ex.id;
          } else {
            const novo = {
              id: 'it-' + Date.now(),
              produtoId: produto.id,
              codigoBarras: produto.codigoBarras,
              nome: produto.nome,
              preco: produto.preco,
              qtd: quantidade,
              unidade: un,
              subtotal: parseFloat((quantidade * produto.preco).toFixed(2))
            };
            nItens = [...aba.itens, novo];
            sId = novo.id;
          }
          return { ...aba, itens: nItens, selectedId: sId };
        }));
      };

      const alterarQtd = (id, delta) => {
        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;
          const nItens = aba.itens.map(i => {
            if (i.id === id) {
              const passo = i.unidade === 'KG' ? 0.1 : 1;
              const nQtd = Math.max(passo, parseFloat((i.qtd + (delta > 0 ? passo : -passo)).toFixed(3)));
              return { ...i, qtd: nQtd, subtotal: parseFloat((nQtd * i.preco).toFixed(2)) };
            }
            return i;
          });
          return { ...aba, itens: nItens };
        }));
      };

      const removerItem = (id) => {
        setAbas(prev => prev.map(aba => {
          if (aba.id !== abaAtivaId) return aba;
          const filtrados = aba.itens.filter(i => i.id !== id);
          const sId = filtrados.length > 0 ? filtrados[filtrados.length - 1].id : null;
          return { ...aba, itens: filtrados, selectedId: sId };
        }));
      };

      // Leitor com Suporte a Multiplicação e Balança EAN-13 iniciando com '2' (PDVOpen)
      const handleBarcodeSubmit = (e) => {
        e.preventDefault();
        const entrada = codigoInput.trim();
        if (!entrada) return;

        if (!caixaAberto) {
          sound.playError();
          setErroMsg('Caixa fechado! Abra o caixa [F3] antes de bipar itens.');
          return;
        }

        let qtd = 1;
        let cod = entrada;
        if (entrada.includes('*')) {
          const p = entrada.split('*');
          const q = parseFloat(p[0]);
          if (!isNaN(q) && q > 0) { qtd = q; cod = p[1].trim(); }
        }

        // Reconhecimento de Código de Balança Nacional EAN-13 (começa com 2)
        if (cod.startsWith('2') && (cod.length === 12 || cod.length === 13)) {
          const codProd = cod.substring(1, 6).replace(/^0+/, ''); // extrai código do item
          const centavos = parseInt(cod.substring(6, 12), 10);
          const valorReais = centavos / 100.0;

          const prodBalanca = PRODUTOS_DEMO.find(p => p.codigoItemBalanca === codProd || p.id === codProd);
          if (prodBalanca) {
            const pesoKg = parseFloat((valorReais / prodBalanca.preco).toFixed(3));
            adicionarAoCarrinho(prodBalanca, pesoKg, 'KG');
            setCodigoInput('');
            return;
          }
        }

        const prod = PRODUTOS_DEMO.find(p => p.codigoBarras === cod);
        if (prod) {
          adicionarAoCarrinho(prod, qtd);
          setCodigoInput('');
        } else {
          sound.playError();
          setErroMsg(`Produto com código '${cod}' não localizado.`);
        }
      };

      const totalBruto = itens.reduce((acc, i) => acc + i.subtotal, 0);
      const totalLiquido = Math.max(0, totalBruto - desconto);
      const totalItens = itens.reduce((acc, i) => acc + (i.unidade === 'KG' ? 1 : i.qtd), 0);

      return (
        <div className="flex flex-col h-screen overflow-hidden">
          {/* HEADER */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-md shadow-emerald-500/50"></span>
              <span className="font-black text-lg text-white font-mono tracking-wider">PDV ATYLUS</span>
              <button
                onClick={() => setModalCaixa(true)}
                className={`px-3 py-1 rounded-full text-xs font-mono font-bold border transition ${
                  caixaAberto ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800' : 'bg-red-950/60 text-red-400 border-red-800'
                }`}
              >
                CAIXA {caixaAberto ? 'ABERTO' : 'FECHADO'} (F3)
              </button>
            </div>

            <div className="flex items-center gap-4 text-xs font-mono text-slate-400">
              <span>Operador: <strong className="text-slate-200">Luiz Portella</strong> (OP01)</span>
              <button
                onClick={() => { sound.muted = !sound.muted; setIsMuted(sound.muted); }}
                className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold"
              >
                {isMuted ? '🔇 Mudo' : '🔊 Som Ativo'}
              </button>
            </div>
          </header>

          {/* BARRA DE MÚLTIPLAS ABAS (PDVOpen Multi-Vendas) */}
          <div className="bg-slate-900/90 border-b border-slate-800 px-3 py-1.5 flex items-center gap-2 overflow-x-auto select-none font-mono">
            <span className="text-[11px] font-bold text-slate-500 uppercase mr-1">Atendimento:</span>
            {abas.map((aba, index) => {
              const isAtiva = aba.id === abaAtivaId;
              const totalAba = aba.itens.reduce((acc, i) => acc + i.subtotal, 0);

              return (
                <div
                  key={aba.id}
                  onClick={() => setAbaAtivaId(aba.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 cursor-pointer transition border ${
                    isAtiva
                      ? 'bg-emerald-600 text-white border-emerald-500 shadow-md'
                      : 'bg-slate-800/80 text-slate-400 border-slate-700 hover:bg-slate-800 text-slate-300'
                  }`}
                >
                  <span>{index + 1}. {aba.titulo}</span>
                  {totalAba > 0 && (
                    <span className={`text-[10px] px-1.5 py-0.2 rounded font-bold ${isAtiva ? 'bg-emerald-700 text-white' : 'bg-slate-700 text-slate-200'}`}>
                      R$ {totalAba.toFixed(2)}
                    </span>
                  )}
                  {abas.length > 1 && (
                    <button
                      onClick={(e) => { e.stopPropagation(); fecharAba(aba.id); }}
                      className="hover:text-red-300 ml-0.5 text-xs font-bold"
                      title="Fechar aba (Ctrl+W)"
                    >✕</button>
                  )}
                </div>
              );
            })}

            <button
              onClick={() => criarNovaAba()}
              title="Abrir nova venda em espera (Ctrl+T)"
              className="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-bold flex items-center gap-1 transition"
            >
              <span>+ Nova Venda</span>
              <kbd className="text-[10px] text-slate-500 bg-slate-900 px-1 rounded">Ctrl+T</kbd>
            </button>

            {abaAtiva.clienteNome && (
              <div className="ml-auto text-xs text-sky-400 flex items-center gap-1.5 bg-sky-950/60 px-2.5 py-1 rounded-lg border border-sky-800">
                <span>👤 Cliente: <strong>{abaAtiva.clienteNome}</strong></span>
              </div>
            )}
          </div>

          {/* ÁREA DE VENDA */}
          <div className="flex-1 flex p-3 gap-3 overflow-hidden">
            {/* LADO ESQUERDO: Bipador e Carrinho */}
            <div className="flex-[2] flex flex-col gap-3 min-w-0">
              {/* INPUT LEITOR */}
              <form onSubmit={handleBarcodeSubmit} className="relative">
                <input
                  ref={barcodeInputRef}
                  type="text"
                  placeholder="Bipe código, digite 3*código ou balança 2000100012505..."
                  value={codigoInput}
                  onChange={e => setCodigoInput(e.target.value)}
                  className="w-full pl-4 pr-24 py-3.5 bg-slate-900 border-2 border-slate-700 rounded-2xl text-xl font-mono font-bold text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 shadow-lg tracking-wider"
                />
                <button type="submit" className="absolute right-2 top-2 px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-mono font-bold text-sm">
                  Enter
                </button>
                {erroMsg && (
                  <div className="mt-1 text-red-400 text-xs font-mono bg-red-950/80 p-2 rounded-lg border border-red-800">
                    ⚠️ {erroMsg}
                  </div>
                )}
              </form>

              {/* TABELA DE ITENS */}
              <div className="flex-1 bg-slate-900/80 rounded-2xl border border-slate-800 flex flex-col overflow-hidden shadow-inner">
                {itens.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center text-slate-500 p-8">
                    <span className="text-4xl mb-2">🛒</span>
                    <h3 className="text-xl font-bold text-slate-400">Venda sem Itens ({abaAtiva.titulo})</h3>
                    <p className="text-sm mt-1">Bipe um item ou aperte <kbd className="px-2 py-0.5 bg-slate-800 text-emerald-400 rounded">F2</kbd> para pesquisar.</p>
                  </div>
                ) : (
                  <div className="overflow-y-auto flex-1">
                    <table className="w-full text-left text-sm border-collapse font-mono">
                      <thead className="bg-slate-800 text-slate-400 text-xs uppercase sticky top-0">
                        <tr>
                          <th className="p-3 text-center w-12">#</th>
                          <th className="p-3 w-36">Código</th>
                          <th className="p-3 font-sans">Descrição</th>
                          <th className="p-3 text-right w-24">Unitário</th>
                          <th className="p-3 text-center w-36">Qtd / Peso</th>
                          <th className="p-3 text-right w-28">Subtotal</th>
                          <th className="p-3 text-center w-12">X</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {itens.map((i, idx) => (
                          <tr
                            key={i.id}
                            onClick={() => atualizarAbaAtual({ selectedId: i.id })}
                            className={`cursor-pointer transition ${i.id === selectedId ? 'bg-emerald-950/40 text-white border-l-4 border-emerald-500' : 'hover:bg-slate-800/40 text-slate-300'}`}
                          >
                            <td className="p-3 text-center text-xs text-slate-500">{String(idx + 1).padStart(2, '0')}</td>
                            <td className="p-3 text-xs text-slate-400">{i.codigoBarras}</td>
                            <td className="p-3 font-sans font-medium text-slate-200">
                              {i.nome}
                              {i.unidade === 'KG' && <span className="ml-2 px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 text-[10px] border border-amber-800 font-mono font-bold">KG</span>}
                            </td>
                            <td className="p-3 text-right">R$ {i.preco.toFixed(2)}</td>
                            <td className="p-3 text-center">
                              <div className="flex items-center justify-center gap-1.5" onClick={e => e.stopPropagation()}>
                                <button onClick={() => alterarQtd(i.id, -1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 font-bold">-</button>
                                <span className="w-12 text-center font-bold text-white text-xs">{i.unidade === 'KG' ? `${i.qtd.toFixed(3)} kg` : i.qtd}</span>
                                <button onClick={() => alterarQtd(i.id, 1)} className="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 font-bold">+</button>
                              </div>
                            </td>
                            <td className="p-3 text-right font-bold text-emerald-400 text-base">R$ {i.subtotal.toFixed(2)}</td>
                            <td className="p-3 text-center" onClick={e => e.stopPropagation()}>
                              <button onClick={() => removerItem(i.id)} className="text-slate-500 hover:text-red-400">🗑️</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>

            {/* LADO DIREITO: Painel Digital e Botões */}
            <div className="flex-1 flex flex-col gap-3 min-w-[320px] max-w-[420px]">
              {/* DISPLAY FINANCEIRO */}

                    <span className="font-bold text-red-400">- R$ {desconto.toFixed(2)}</span>

                <div className="space-y-2">
                  <button
                    onClick={() => {
                      if (itens.length > 0 && caixaAberto) setModalPagamento(true);
                      else { sound.playError(); setErroMsg('Caixa fechado ou carrinho vazio.'); }
                    }}
                    disabled={itens.length === 0}
                    className="w-full py-4 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-black text-base flex justify-between items-center shadow-lg shadow-emerald-500/20 transition active:scale-95"
                  >
                    <span>✅ FINALIZAR VENDA</span>
                    <kbd className="px-2 py-0.5 rounded bg-emerald-600/70 text-slate-950 text-xs">F1</kbd>
                  </button>

                  <button
                    onClick={() => setModalBusca(true)}
                    className="w-full py-3 px-4 rounded-xl bg-sky-950/60 hover:bg-sky-900/70 border border-sky-800/60 text-sky-200 font-bold text-sm flex justify-between items-center"
                  >
                    <span>🔍 BUSCAR PRODUTO</span>
                    <kbd className="px-2 py-0.5 rounded bg-sky-900 text-sky-300 text-xs">F2</kbd>
                  </button>

                  <button
                    onClick={() => setModalCaixa(true)}
                    className="w-full py-3 px-4 rounded-xl bg-amber-950/60 hover:bg-amber-900/70 border border-amber-800/60 text-amber-200 font-bold text-sm flex justify-between items-center"
                  >
                    <span>🔒 CONTROLE DE CAIXA</span>
                    <kbd className="px-2 py-0.5 rounded bg-amber-900 text-amber-300 text-xs">F3</kbd>
                  </button>

                  <button
                    onClick={() => setModalImportador(true)}
                    className="w-full py-3 px-4 rounded-xl bg-indigo-950/60 hover:bg-indigo-900/70 border border-indigo-800/60 text-indigo-200 font-bold text-sm flex justify-between items-center"
                  >
                    <span>📊 IMPORTAR IA & NF-e XML</span>
                    <kbd className="px-2 py-0.5 rounded bg-indigo-900 text-indigo-300 text-xs">F4</kbd>
                  </button>
                </div>

                <button
                  onClick={() => { if (itens.length > 0 && confirm('Limpar itens da venda atual?')) atualizarAbaAtual({ itens: [], selectedId: null, desconto: 0 }); }}
                  className="w-full py-2.5 px-3 rounded-xl bg-slate-800/60 hover:bg-red-950/50 hover:text-red-400 border border-slate-700/60 text-slate-400 text-xs font-bold flex justify-between items-center"
                >
                  <span>🔄 LIMPAR CARRINHO</span>
                  <kbd className="px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 text-[10px]">Esc</kbd>
                </button>

          {modalPagamento && (
            <ModalPagamentoMultiformasComponent

              clienteNomeInicial={abaAtiva.clienteNome}
              clienteDocInicial={abaAtiva.clienteDoc}

              onSucesso={(pagamentos, clienteInfo) => {
                sound.playChime();
                const venda = {
                  id: 'VND-' + Date.now().toString().slice(-6),
                  dataVenda: new Date().toISOString(),
                  operador: 'Luiz Portella',
                  clienteNome: clienteInfo.nome,
                  clienteDoc: clienteInfo.doc,
                  itens: [...itens],
                  subtotal: totalBruto,
                  desconto,
                  total: totalLiquido,
                  pagamentos: pagamentos
                };
                fecharAba(abaAtivaId);
                setModalPagamento(false);
                setVendaConcluida(venda);
              }}
            />
          )}

          {/* MODAL BUSCA (F2) */}
          {modalBusca && (
            <ModalBuscaComponent
              produtos={PRODUTOS_DEMO}
              onClose={() => setModalBusca(false)}
              onSelecionar={p => {
                adicionarAoCarrinho(p, p.unidade === 'KG' ? 0.5 : 1);
                setModalBusca(false);
              }}
            />
          )}

          {/* MODAL CAIXA (F3) */}
          {modalCaixa && (
            <ModalCaixaComponent
              caixaAberto={caixaAberto}
              saldoInicial={saldoInicial}
              movimentacoes={movimentacoes}
              onAbrir={saldo => {
                setSaldoInicial(saldo);
                setCaixaAberto(true);
                setMovimentacoes([{ id: Date.now(), tipo: 'Suprimento', valor: saldo, motivo: 'Abertura de Caixa', data: new Date().toLocaleTimeString() }]);
                setModalCaixa(false);
              }}
              onMovimentacao={(tipo, val, mot) => {
                setMovimentacoes(prev => [...prev, { id: Date.now(), tipo, valor: val, motivo: mot, data: new Date().toLocaleTimeString() }]);

              onFecharCego={saldoContado => {
                setCaixaAberto(false);
                setModalCaixa(false);
                alert(`Caixa Fechado com Sucesso! Valor Informado: R$ ${saldoContado.toFixed(2)}. Backup SQLite compactado.`);

            <ModalImportadorAvancadoComponent

              }}
            />
          )}

          {/* MODAL CUPOM TÉRMICO */}
          {vendaConcluida && (
            <ModalCupomAvancadoComponent
              venda={vendaConcluida}
              onClose={() => setVendaConcluida(null)}
            />
          )}
        </div>
      );

    // --- MODAL PAGAMENTO MULTIFORMAS (PDVOpen) ---
    function ModalPagamentoMultiformasComponent({ total, clienteNomeInicial, clienteDocInicial, onClose, onSucesso }) {
      const [forma, setForma] = useState('Dinheiro');
      const [pagamentosLancados, setPagamentosLancados] = useState([]);
      const [clienteNome, setClienteNome] = useState(clienteNomeInicial || '');
      const [clienteDoc, setClienteDoc] = useState(clienteDocInicial || '');

      const totalPago = pagamentosLancados.reduce((acc, p) => acc + (p.valor - (p.troco || 0)), 0);
      const restante = Math.max(0, parseFloat((total - totalPago).toFixed(2)));
      const isQuitado = restante <= 0.009;

      const [valorParcela, setValorParcela] = useState(total);
      const [dinheiroEntregue, setDinheiroEntregue] = useState(total);

      useEffect(() => {
        if (restante > 0) {
          setValorParcela(restante);
          setDinheiroEntregue(restante);
        }
      }, [restante]);

      const trocoCalculado = forma === 'Dinheiro' ? Math.max(0, dinheiroEntregue - valorParcela) : 0;

      const lancar = () => {
        if (valorParcela <= 0) return;
        setPagamentosLancados(prev => [
          ...prev,
          { id: Date.now(), forma, valor: valorParcela, troco: trocoCalculado }
        ]);
        sound.playScan();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-3xl bg-slate-900 border border-slate-700 rounded-3xl overflow-hidden shadow-2xl flex flex-col font-sans max-h-[95vh]">
            <div className="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
              <div>
                <h3 className="font-bold text-white text-lg">💰 Pagamento Multiformas (Padrão PDVOpen)</h3>
                <p className="text-xs text-slate-400">Total a Pagar: R$ {total.toFixed(2)}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-mono text-xl">✕</button>
            </div>

            {/* Placar de Quitação */}
            <div className="grid grid-cols-3 p-4 bg-slate-950/70 border-b border-slate-800 text-center font-mono">
              <div>
                <span className="text-[10px] text-slate-400 uppercase">Total da Venda</span>
                <div className="text-xl font-bold text-white">R$ {total.toFixed(2)}</div>
              </div>
              <div>
                <span className="text-[10px] text-slate-400 uppercase">Já Lançado</span>
                <div className="text-xl font-bold text-sky-400">R$ {totalPago.toFixed(2)}</div>
              </div>
              <div>
                <span className="text-[10px] uppercase font-bold text-slate-400">{isQuitado ? 'Status' : 'Falta Pagar'}</span>
                <div className={`text-xl font-black ${isQuitado ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {isQuitado ? 'QUITADO' : `R$ ${restante.toFixed(2)}`}
                </div>
              </div>
            </div>

            <div className="p-6 flex-1 overflow-y-auto space-y-4">
              {/* Identificação de Cliente */}
              <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex gap-3 text-xs font-mono">
                <input
                  type="text"
                  placeholder="Nome do Cliente (opcional no cupom)"
                  value={clienteNome}
                  onChange={e => setClienteNome(e.target.value)}
                  className="flex-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-white"
                />
                <input
                  type="text"
                  placeholder="CPF / CNPJ"
                  value={clienteDoc}
                  onChange={e => setClienteDoc(e.target.value)}
                  className="w-48 p-2 bg-slate-900 border border-slate-700 rounded-lg text-white"
                />
              </div>

              {/* Botões de Formas */}
              {!isQuitado && (
                <div className="space-y-3">
                  <div className="grid grid-cols-4 gap-2 font-mono text-xs">
                    {['Dinheiro', 'Pix', 'CartaoCredito', 'CartaoDebito'].map(f => (
                      <button
                        key={f}
                        onClick={() => setForma(f)}
                        className={`p-2.5 rounded-xl font-bold border transition ${forma === f ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                      >
                        {f === 'CartaoCredito' ? '💳 Crédito' : f === 'CartaoDebito' ? '💳 Débito' : f === 'Pix' ? '⚡ Pix' : '💵 Dinheiro'}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 gap-3 font-mono">
                    <div>
                      <label className="text-xs text-slate-400">Valor Desta Parcela (R$):</label>
                      <input
                        type="number"
                        step="0.01"
                        max={restante}
                        value={valorParcela}
                        onChange={e => setValorParcela(Math.min(restante, parseFloat(e.target.value) || 0))}
                        className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-lg font-bold text-white mt-1"
                      />
                    </div>
                    {forma === 'Dinheiro' && (
                      <div>
                        <label className="text-xs text-slate-400">Dinheiro Entregue (Troco):</label>
                        <input
                          type="number"
                          step="0.01"
                          value={dinheiroEntregue}
                          onChange={e => setDinheiroEntregue(parseFloat(e.target.value) || 0)}
                          className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-lg font-bold text-white mt-1"
                        />
                      </div>
                    )}
                  </div>

                  {forma === 'Dinheiro' && trocoCalculado > 0 && (
                    <div className="p-2.5 bg-amber-950/60 border border-amber-800 rounded-xl text-amber-300 font-mono text-xs flex justify-between font-bold">
                      <span>TROCO NESTA PARCELA:</span>
                      <span className="text-base">R$ {trocoCalculado.toFixed(2)}</span>
                    </div>
                  )}

                  <button
                    onClick={lancar}
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-500 font-mono font-bold text-white rounded-xl text-xs"
                  >
                    + Adicionar Parcela de R$ {valorParcela.toFixed(2)} no {forma}
                  </button>
                </div>
              )}

              {/* Lista de Parcelas */}
              <div>
                <h4 className="text-xs font-mono font-bold text-slate-400 uppercase mb-2">Parcelas Confirmadas:</h4>
                {pagamentosLancados.length === 0 ? (
                  <p className="text-xs text-slate-600 font-mono">Nenhum pagamento lançado ainda.</p>
                ) : (
                  <div className="space-y-1.5 font-mono text-xs">
                    {pagamentosLancados.map((p, idx) => (
                      <div key={idx} className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
                        <span>• {p.forma} {p.troco > 0 ? `(Troco R$ ${p.troco.toFixed(2)})` : ''}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-emerald-400 font-bold">R$ {p.valor.toFixed(2)}</span>
                          <button onClick={() => setPagamentosLancados(prev => prev.filter((_, i) => i !== idx))} className="text-red-400 font-bold ml-2">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="p-4 bg-slate-950 border-t border-slate-800 flex justify-between font-mono">
              <button onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">[Esc] Cancelar</button>
              <button
                disabled={!isQuitado}
                onClick={() => onSucesso(pagamentosLancados, { nome: clienteNome, doc: clienteDoc })}
                className={`px-6 py-2.5 rounded-xl font-bold text-xs ${isQuitado ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
              >
                {isQuitado ? 'Confirmar e Fechar Venda (Enter)' : `Falta lançar R$ ${restante.toFixed(2)}`}
              </button>
            </div>
          </div>
        </div>
      );
    }

                        <button onClick={() => setTipo('Suprimento')} className={`flex-1 p-2 rounded text-xs font-bold ${tipo === 'Suprimento' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Entrada (Suprimento)</button>
                      </div>
                      <input type="number" value={val} onChange={e => setVal(parseFloat(e.target.value) || 0)} className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-white" placeholder="Valor" />
                      <input type="text" value={mot} onChange={e => setMot(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-white" placeholder="Motivo" />
                      <button onClick={() => { onMovimentacao(tipo, val, mot); setMot(''); alert('Movimentação registrada!'); }} className="w-full p-2.5 bg-sky-500 font-bold text-slate-950 rounded">Registrar Movimentação</button>
                    </div>
                  )}

                  {aba === 'fechar' && (
                    <div className="space-y-3 pt-2">
                      <p className="text-xs text-amber-300">Digite o valor contado na gaveta para auditoria cega:</p>
                      <input type="number" value={contado} onChange={e => setContado(parseFloat(e.target.value) || 0)} className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-xl font-bold text-white" />
                      <button onClick={() => onFecharCego(contado)} className="w-full p-3 bg-amber-500 font-bold text-slate-950 rounded">Conferir e Fechar Caixa</button>
                    </div>
                  )}
                </>
              ) : (
                <div className="space-y-3">
                  <p className="text-xs text-slate-400">O caixa está fechado. Informe o fundo de troco inicial:</p>
                  <input type="number" value={novoSaldo} onChange={e => setNovoSaldo(parseFloat(e.target.value) || 0)} className="w-full p-3 bg-slate-950 border border-slate-700 rounded text-xl font-bold text-white" />
                  <button onClick={() => onAbrir(novoSaldo)} className="w-full p-3 bg-emerald-500 font-bold text-slate-950 rounded">Confirmar Abertura de Caixa</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ModalCupomAvancadoComponent({ venda, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl flex flex-col font-sans">
            <div className="p-3 bg-slate-800 flex justify-between items-center text-xs font-bold text-white">
              <span>🧾 Cupom Não-Fiscal</span>
              <button onClick={onClose}>✕</button>
            </div>

            <div className="p-4 bg-slate-950 flex justify-center">
              <div id="printable-receipt" className="w-[80mm] bg-amber-50 text-slate-900 p-4 font-mono text-xs select-text border border-slate-300">
                <div className="text-center border-b border-dashed border-slate-400 pb-2 mb-2">
                  <div className="font-bold text-sm">PDV ATYLUS COMERCIAL</div>
                  <div className="text-[10px] text-slate-600">Rua do Comércio, 1000 - Centro</div>
                  <div className="text-[10px] font-bold mt-1">*** CUPOM NÃO FISCAL ***</div>
                </div>

                <div className="text-[10px] border-b border-dashed border-slate-400 pb-2 mb-2 space-y-0.5">
                  <div>Venda: #{venda.id}</div>
                  <div>Data: {new Date().toLocaleString()}</div>
                  <div>Operador: {venda.operador}</div>
                  {venda.clienteNome && (
                    <div className="pt-1 text-slate-700 font-semibold border-t border-slate-200">
                      <div>Cliente: {venda.clienteNome}</div>
                      {venda.clienteDoc && <div>Doc: {venda.clienteDoc}</div>}
                    </div>
                  )}
                </div>

                <div className="border-b border-dashed border-slate-400 pb-2 mb-2 text-[10px]">
                  {venda.itens.map((it, idx) => (
                    <div key={idx} className="flex justify-between my-0.5">
                      <span>{it.unidade === 'KG' ? `${it.qtd.toFixed(3)}kg` : `${it.qtd}x`} {it.nome.slice(0, 16)}</span>
                      <span>R$ {it.subtotal.toFixed(2)}</span>
                    </div>
                  ))}
                </div>

                <div className="border-b border-dashed border-slate-400 pb-2 mb-2 text-xs">
                  <div className="flex justify-between font-bold text-sm">
                    <span>TOTAL:</span>
                    <span>R$ {venda.total.toFixed(2)}</span>
                  </div>

                  <div className="text-[10px] mt-1 space-y-0.5 border-t border-slate-200 pt-1">
                    <div className="font-bold">Pagamento(s):</div>
                    {venda.pagamentos.map((p, idx) => (
                      <div key={idx} className="flex justify-between">
                        <span>• {p.forma}:</span>
                        <span>R$ {p.valor.toFixed(2)}</span>
                      </div>
                    ))}
                    {venda.pagamentos.some(p => p.troco > 0) && (
                      <div className="flex justify-between font-bold text-slate-800 pt-0.5 border-t border-slate-200">
                        <span>TROCO DEVOLVIDO:</span>
                        <span>R$ {venda.pagamentos.find(p => p.troco > 0)?.troco.toFixed(2)}</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="text-center text-[10px] text-slate-600 pt-1">
                  <div>Obrigado pela preferência!</div>
                  <div className="font-mono text-[9px] mt-1">|||||||||||||||||||||||||||||||||</div>
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-900 border-t border-slate-800 flex justify-between text-xs font-mono">
              <button onClick={onClose} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded">[Esc] Fechar</button>
              <button onClick={() => window.print()} className="px-4 py-1.5 bg-emerald-500 font-bold text-slate-950 rounded">Imprimir Cupom</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
